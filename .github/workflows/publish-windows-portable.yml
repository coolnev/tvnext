name: Publish TVNext Windows 1.0.25 r2

on:
  push:
    branches: [main]
    paths:
      - releases/windows/portable-parts/**
      - .github/workflows/publish-windows-portable.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tvnext-windows-1.0.25-r2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /releases/windows/
      - name: Verify the tested Windows archive
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tvnext-portable"
          cat releases/windows/portable-parts/TVNext-1.0.25-windows-x64-portable-r2.zip.part-* > "$RUNNER_TEMP/tvnext-portable/TVNext-1.0.25-windows-x64-portable-r2.zip"
          cp releases/windows/TVNext-1.0.25-windows-x64-portable-r2.zip.sha256 "$RUNNER_TEMP/tvnext-portable/"
          (cd "$RUNNER_TEMP/tvnext-portable" && sha256sum --check TVNext-1.0.25-windows-x64-portable-r2.zip.sha256 && unzip -tq TVNext-1.0.25-windows-x64-portable-r2.zip)
      - name: Publish Windows portable
        id: windows
        if: steps.assemble.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=windows-v1.0.25-r2
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --latest=false --title 'TVNext 1.0.25 r2 — Windows portable x64' \
              --notes 'Добавлены GPU-вывод ANGLE/Direct3D 11 и отдельный совместимый аппаратный режим. Под каналами появился прогресс передач; подпись «Эфир» привязана к красной отметке, ползунки выровнены. F11 сохраняет одно окно и графический контекст. 108 JVM/Compose-проверок прошли, нативные ANGLE и автоматический fallback проверены под Wine. Физический Windows GPU здесь не проверен. Версия 1.0.25; Android без изменений. Распакуйте весь ZIP и перенесите свою папку data. Подробнее: RELEASE_WINDOWS_1.0.25_R2_RU.md в исходниках.'
          fi
          cd "$RUNNER_TEMP/tvnext-portable"
          for file in TVNext-1.0.25-windows-x64-portable-r2.zip TVNext-1.0.25-windows-x64-portable-r2.zip.sha256; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              mkdir -p existing
              gh release download "$tag" --pattern "$file" --dir existing --clobber
              cmp "$file" "existing/$file"
            else
              gh release upload "$tag" "$file"
            fi
          done
      - name: Record publication status
        if: always()
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          WINDOWS_OUTCOME: ${{ steps.windows.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          base='https://github.com/'+os.environ['REPOSITORY']
          payload={
            'version':'1.0.25',
            'revision':'r2',
            'assemble':os.environ['ASSEMBLE_OUTCOME'],
            'windows':os.environ['WINDOWS_OUTCOME'],
            'workflow':base+'/actions/runs/'+os.environ['RUN_ID'],
            'windowsDownload':base+'/releases/download/windows-v1.0.25-r2/TVNext-1.0.25-windows-x64-portable-r2.zip',
            'windowsSha256':'c47cb5d87b912cea28f252112cd1a0ab3e63cea959f367f08a77d79f50e05892',
          }
          Path('releases/windows/publication-1.0.25-r2.json').write_text(json.dumps(payload,indent=2)+'\n')
          PYREPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/windows/publication-1.0.25-r2.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Windows 1.0.25 r2 publication result'
            git push origin HEAD:main
          fi
