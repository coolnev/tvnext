name: Publish TVNext Windows 1.0.25 r4

on:
  push:
    branches: [main]
    paths:
      - releases/windows/portable-parts/**
      - .github/workflows/publish-windows-portable.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tvnext-windows-1.0.25-r4
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /releases/windows/
      - name: Verify the tested Windows archive
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tvnext-portable"
          cat releases/windows/portable-parts/TVNext-1.0.25-windows-x64-portable-r4.zip.part-* > "$RUNNER_TEMP/tvnext-portable/TVNext-1.0.25-windows-x64-portable-r4.zip"
          cp releases/windows/TVNext-1.0.25-windows-x64-portable-r4.zip.sha256 "$RUNNER_TEMP/tvnext-portable/"
          (cd "$RUNNER_TEMP/tvnext-portable" && sha256sum --check TVNext-1.0.25-windows-x64-portable-r4.zip.sha256 && unzip -tq TVNext-1.0.25-windows-x64-portable-r4.zip)
      - name: Publish Windows portable
        id: windows
        if: steps.assemble.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=windows-v1.0.25-r4
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --latest=false --title 'TVNext 1.0.25 r4 — Windows portable x64' \
              --notes 'Исправлена утечка общего GPU-состояния при изменении размеров окна: после видео восстанавливаются буферы окна и viewport, включая ошибки и фоновое обслуживание. Аппаратный декодер и GPU-вывод сохраняются при переходе между режимами. 111 JVM/Compose-проверок прошли. Нативный Windows ANGLE тест проверил семь размеров окна, продолжение видео и доступность буфера UI; полноценный F11 на физическом ПК здесь не проверялся. Версия 1.0.25, Android без изменений. Закройте прежнюю копию, распакуйте ZIP и перенесите свою папку data. Подробнее: RELEASE_WINDOWS_1.0.25_R4_RU.md.'
          fi
          cd "$RUNNER_TEMP/tvnext-portable"
          for file in TVNext-1.0.25-windows-x64-portable-r4.zip TVNext-1.0.25-windows-x64-portable-r4.zip.sha256; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              mkdir -p existing
              gh release download "$tag" --pattern "$file" --dir existing --clobber
              cmp "$file" "existing/$file"
            else
              gh release upload "$tag" "$file"
            fi
          done
      - name: Record publication status
        if: always()
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          WINDOWS_OUTCOME: ${{ steps.windows.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          base='https://github.com/'+os.environ['REPOSITORY']
          payload={
            'version':'1.0.25',
            'revision':'r4',
            'assemble':os.environ['ASSEMBLE_OUTCOME'],
            'windows':os.environ['WINDOWS_OUTCOME'],
            'workflow':base+'/actions/runs/'+os.environ['RUN_ID'],
            'windowsDownload':base+'/releases/download/windows-v1.0.25-r4/TVNext-1.0.25-windows-x64-portable-r4.zip',
            'windowsSha256':'5e2726d4282bf35ddc8af3d2c3e50c5758e9b5a9c43d9e905428384dcc9a5330',
          }
          Path('releases/windows/publication-1.0.25-r4.json').write_text(json.dumps(payload,indent=2)+'\n')
          PYREPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/windows/publication-1.0.25-r4.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Windows 1.0.25 r4 publication result'
            git push origin HEAD:main
          fi
