name: Publish TVNext Windows 1.0.25 r5

on:
  push:
    branches: [main]
    paths:
      - releases/windows/portable-parts/**
      - .github/workflows/publish-windows-portable.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-tvnext-windows-1.0.25-r5
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /releases/windows/
      - name: Verify the tested Windows archive
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tvnext-portable"
          cat releases/windows/portable-parts/TVNext-1.0.25-windows-x64-portable-r5.zip.part-* > "$RUNNER_TEMP/tvnext-portable/TVNext-1.0.25-windows-x64-portable-r5.zip"
          cp releases/windows/TVNext-1.0.25-windows-x64-portable-r5.zip.sha256 "$RUNNER_TEMP/tvnext-portable/"
          (cd "$RUNNER_TEMP/tvnext-portable" && sha256sum --check TVNext-1.0.25-windows-x64-portable-r5.zip.sha256 && unzip -tq TVNext-1.0.25-windows-x64-portable-r5.zip)
      - name: Publish Windows portable
        id: windows
        if: steps.assemble.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=windows-v1.0.25-r5
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --latest=false --title 'TVNext 1.0.25 r5 — Windows portable x64' \
              --notes 'Полный экран теперь расширяет то же окно без рамок до границ монитора, без вызова эксклюзивного fullscreen AWT/Skiko. При возврате восстанавливаются размеры и максимизация. GPU-вывод сохраняется. 115 JVM/Compose-проверок прошли; Windows JRE под Wine проверил пять циклов настоящего окна, сохранение HWND и видимость UI. Полная Compose/libmpv GPU-композиция на физическом ПК здесь не проверена. В заголовке r5, журнал data/window-transitions.log ограничен 256 КБ с резервной копией. Версия 1.0.25 сохранена, Android не менялся. Закройте прежнюю копию, распакуйте ZIP и перенесите data. Подробнее: RELEASE_WINDOWS_1.0.25_R5_RU.md.'
          fi
          cd "$RUNNER_TEMP/tvnext-portable"
          for file in TVNext-1.0.25-windows-x64-portable-r5.zip TVNext-1.0.25-windows-x64-portable-r5.zip.sha256; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              mkdir -p existing
              gh release download "$tag" --pattern "$file" --dir existing --clobber
              cmp "$file" "existing/$file"
            else
              gh release upload "$tag" "$file"
            fi
          done
      - name: Record publication status
        if: always()
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          WINDOWS_OUTCOME: ${{ steps.windows.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PYREPORT'
          import json, os
          from pathlib import Path
          base='https://github.com/'+os.environ['REPOSITORY']
          payload={
            'version':'1.0.25',
            'revision':'r5',
            'assemble':os.environ['ASSEMBLE_OUTCOME'],
            'windows':os.environ['WINDOWS_OUTCOME'],
            'workflow':base+'/actions/runs/'+os.environ['RUN_ID'],
            'windowsDownload':base+'/releases/download/windows-v1.0.25-r5/TVNext-1.0.25-windows-x64-portable-r5.zip',
            'windowsSha256':'387aefe9f2f62b678f0cfa44d869900223a8541cd672d2be8d564e73fcebf384',
          }
          Path('releases/windows/publication-1.0.25-r5.json').write_text(json.dumps(payload,indent=2)+'\n')
          PYREPORT
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/windows/publication-1.0.25-r5.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Windows 1.0.25 r5 publication result'
            git push origin HEAD:main
          fi
