name: Publish Windows portable 1.0.24 r3

on:
  push:
    branches: [main]
    paths:
      - releases/windows/portable-parts/**
      - .github/workflows/publish-windows-portable.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-windows-portable-1.0.24-r3
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          sparse-checkout: releases/windows
      - name: Reassemble and verify the tested archive
        id: assemble
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/tvnext-portable"
          cat releases/windows/portable-parts/TVNext-1.0.24-windows-x64-portable-r3.zip.part-* > "$RUNNER_TEMP/tvnext-portable/TVNext-1.0.24-windows-x64-portable-r3.zip"
          cp releases/windows/TVNext-1.0.24-windows-x64-portable-r3.zip.sha256 "$RUNNER_TEMP/tvnext-portable/"
          cd "$RUNNER_TEMP/tvnext-portable"
          sha256sum --check TVNext-1.0.24-windows-x64-portable-r3.zip.sha256
          unzip -tq TVNext-1.0.24-windows-x64-portable-r3.zip
      - name: Publish one ZIP as a GitHub release asset
        id: publish
        if: steps.assemble.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          tag=windows-v1.0.24-r3
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" --verify-tag --latest=false \
              --title 'TVNext 1.0.24 — Windows portable x64 r3' \
              --notes 'Настройки сразу открываются целиком; постер слева от описания, адаптивное верхнее меню, список каналов у левого края видео, эфир без случайной паузы. Добавлены тонкая громкость, перемотка архива мышью, отметка эфира и кнопка «В эфир». Исправлено положение текущей передачи и сброс архивного выбора при смене каналов. Распакуйте весь ZIP и запустите TVNext.exe. Java и кодеки включены. Версия приложения 1.0.24 сохранена. Свою папку data сохраните при обновлении. Android-код и APK не изменены.'
          fi
          cd "$RUNNER_TEMP/tvnext-portable"
          for file in TVNext-1.0.24-windows-x64-portable-r3.zip TVNext-1.0.24-windows-x64-portable-r3.zip.sha256; do
            if gh release view "$tag" --json assets --jq '.assets[].name' | grep -Fxq "$file"; then
              mkdir -p existing
              gh release download "$tag" --pattern "$file" --dir existing --clobber
              cmp "$file" "existing/$file"
            else
              gh release upload "$tag" "$file"
            fi
          done
      - name: Record publication status in the repository
        if: always()
        env:
          ASSEMBLE_OUTCOME: ${{ steps.assemble.outcome }}
          PUBLISH_OUTCOME: ${{ steps.publish.outcome }}
          REPOSITORY: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          base='https://github.com/'+os.environ['REPOSITORY']
          payload={
            'version':'1.0.24',
            'assemble':os.environ['ASSEMBLE_OUTCOME'],
            'publish':os.environ['PUBLISH_OUTCOME'],
            'workflow':base+'/actions/runs/'+os.environ['RUN_ID'],
            'download':base+'/releases/download/windows-v1.0.24-r3/TVNext-1.0.24-windows-x64-portable-r3.zip',
            'sha256':'69af3162ccbc5839fc79a795eaa7a3133a019f3886f690e599f1e90ca4572196',
          }
          Path('releases/windows/publication-1.0.24-r3.json').write_text(json.dumps(payload,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add releases/windows/publication-1.0.24-r3.json
          if ! git diff --cached --quiet; then
            git commit -m 'Record Windows portable 1.0.24 publication result'
            git push origin HEAD:main
          fi
